<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Jobs | CLT India Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #088f8f;
      --teal-dark: #066e6e;
      --dark: #1a1a2e;
      --border: #e3e8ef;
      --text-light: #5f6c80;
      --white: #ffffff;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: #f2f6f8; color: var(--dark); }
    .topbar { background: var(--dark); color: var(--white); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-size: 1.1rem; margin: 0; font-weight: 700; }
    .topbar a { color: #7fd4d4; font-size: 0.85rem; text-decoration: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
    .card h2 { font-size: 1.15rem; margin: 0 0 20px; font-weight: 700; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-family: inherit; font-size: 0.9rem; margin-bottom: 16px;
      transition: 0.2s; background: var(--white); color: var(--dark);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8,143,143,0.12); }
    textarea { resize: vertical; }
    .btn { background: var(--teal); color: var(--white); border: none; padding: 12px 28px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn:hover { background: var(--teal-dark); }
    .btn-sm { padding: 7px 16px; font-size: 0.8rem; }
    .btn-danger { background: #e5484d; }
    .btn-danger:hover { background: #c93a3f; }
    .hint { font-size: 0.78rem; color: var(--text-light); margin-top: -8px; margin-bottom: 16px; }

    .msg { display: none; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; }
    .msg.ok { display: block; background: #e6f7ee; color: #0e7a45; }
    .msg.err { display: block; background: #fdeaea; color: #b3261e; }

    .job-item { border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .job-item .j-title { font-weight: 700; margin: 0 0 4px; }
    .job-item .j-meta { font-size: 0.8rem; color: var(--text-light); margin: 0; }
    .job-item .actions { display: flex; gap: 8px; flex-shrink: 0; }

    .empty { color: var(--text-light); font-size: 0.9rem; text-align: center; padding: 24px; }
    .login-box { max-width: 360px; margin: 12vh auto; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .login-box h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .login-box p { color: var(--text-light); font-size: 0.85rem; margin: 0 0 20px; }

    @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NGO",
    "name": "Children's LoveCastle Trust India",
    "alternateName": "CLT India",
    "url": "https://cltindia.org/",
    "logo": "https://cltindia.org/assets/Clt-Logo.png",
    "description": "Transforming education for underprivileged children through digital STEM programs, e-Patashale, and community outreach.",
    "address": { "@type": "PostalAddress", "addressLocality": "Bangalore", "addressRegion": "Karnataka", "addressCountry": "IN" },
    "sameAs": ["https://www.facebook.com/CLTIndia.1997","https://www.instagram.com/cltindia/","https://www.linkedin.com/company/cltindia/","https://www.youtube.com/@study-e-stationbycltindia9626/"]
  }
  </script>
</head>
<body>

  <div class="topbar">
    <h1>CLT India — Job Manager</h1>
    <a href="career.html" target="_blank">View Careers Page →</a>
  </div>

  <div class="login-box" id="loginBox">
    <h2>Admin Login</h2>
    <p>Enter password to manage job postings.</p>
    <input type="password" id="pwdInput" placeholder="Password">
    <button class="btn" onclick="checkPassword()" style="width:100%;">Login</button>
    <p class="hint" style="margin-top:12px;">Password change karni ho to manage-jobs.html ke code mein <code>ADMIN_PASSWORD</code> edit karo.</p>
  </div>

  <div class="wrap" id="adminPanel" style="display:none;">
    <div class="msg" id="msgBox"></div>

    <div class="card">
      <h2>Post a New Job</h2>
      <div class="form-grid">
        <div class="full">
          <label>Job Title *</label>
          <input type="text" id="jTitle" placeholder="e.g. Digital Content Developer">
        </div>
        <div>
          <label>Department</label>
          <input type="text" id="jDepartment" placeholder="e.g. e-Patashale">
        </div>
        <div>
          <label>Location</label>
          <input type="text" id="jLocation" placeholder="e.g. Bangalore">
        </div>
        <div>
          <label>Job Type</label>
          <select id="jType">
            <option>Full-time</option>
            <option>Part-time</option>
            <option>Field-based</option>
            <option>Contract</option>
            <option>Internship</option>
          </select>
        </div>
        <div>
          <label>Experience</label>
          <input type="text" id="jExperience" placeholder="e.g. 2-5 years">
        </div>
        <div class="full">
          <label>Short Description *</label>
          <textarea id="jDescription" rows="2" placeholder="1-2 lines about the role"></textarea>
        </div>
        <div class="full">
          <label>Responsibilities * (har point nayi line par)</label>
          <textarea id="jResponsibilities" rows="4" placeholder="Develop interactive digital lessons&#10;Work with teachers&#10;Test content on learning devices"></textarea>
        </div>
        <div class="full">
          <label>Requirements * (har point nayi line par)</label>
          <textarea id="jRequirements" rows="4" placeholder="Degree in Education or Engineering&#10;2+ years experience&#10;Kannada + English communication"></textarea>
        </div>
        <div class="full">
          <button class="btn" onclick="postJob()">Publish Job</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Current Openings</h2>
      <div id="jobsList"></div>
    </div>
  </div>

  <script>
    /* ==== Replace with your deployed Apps Script URL ==== */
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGtQ9smsy8MKsKhn6By52EjJJ5EZghZuSmTI1Nq1KPrEAgiAAXJJklZfBzMeetFR6bNA/exec';
    var ADMIN_PASSWORD = 'cltadmin123';

    if (localStorage.getItem('clt_admin') === '1') {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadJobs();
    }

    function checkPassword() {
      var pwd = document.getElementById('pwdInput').value;
      if (pwd === ADMIN_PASSWORD) {
        localStorage.setItem('clt_admin', '1');
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadJobs();
      } else {
        alert('Wrong password!');
      }
    }

    function showMsg(text, ok) {
      var box = document.getElementById('msgBox');
      box.className = 'msg ' + (ok ? 'ok' : 'err');
      box.textContent = text;
      setTimeout(function () { box.className = 'msg'; }, 5000);
    }

    function postJob() {
      var payload = {
        type: 'jobpost',
        title: document.getElementById('jTitle').value.trim(),
        department: document.getElementById('jDepartment').value.trim(),
        location: document.getElementById('jLocation').value.trim(),
        jobType: document.getElementById('jType').value,
        experience: document.getElementById('jExperience').value.trim(),
        description: document.getElementById('jDescription').value.trim(),
        responsibilities: document.getElementById('jResponsibilities').value.trim(),
        requirements: document.getElementById('jRequirements').value.trim()
      };

      if (!payload.title || !payload.description || !payload.responsibilities || !payload.requirements) {
        showMsg('Please fill all required fields (marked *)', false);
        return;
      }

      submitPost(payload, function (res) {
        if (res === null || res.success === true) {
          showMsg('Job published successfully!', true);
          document.getElementById('jTitle').value = '';
          document.getElementById('jDepartment').value = '';
          document.getElementById('jLocation').value = '';
          document.getElementById('jExperience').value = '';
          document.getElementById('jDescription').value = '';
          document.getElementById('jResponsibilities').value = '';
          document.getElementById('jRequirements').value = '';
          loadJobs();
        } else {
          showMsg(res.error || 'Failed to post job', false);
        }
      });
    }

    function deleteJob(id, title) {
      if (!confirm('Remove "' + title + '" from the website?')) return;
      submitPost({ type: 'jobdelete', id: id }, function (res) {
        if (res === null || res.success === true) {
          showMsg('Job removed.', true);
          loadJobs();
        } else {
          showMsg(res.error || 'Failed to remove job', false);
        }
      });
    }

    function loadJobs() {
      var list = document.getElementById('jobsList');
      list.innerHTML = '<p class="empty">Loading jobs...</p>';
      var cb = 'cltJobsCb' + Date.now();
      var script = document.createElement('script');
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        delete window[cb];
        list.innerHTML = '<p class="empty">No response from server. Check APPS_SCRIPT_URL and that the Apps Script is deployed with the latest code.</p>';
      }, 8000);
      window[cb] = function (jobs) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        delete window[cb];
        renderJobList(jobs || []);
      };
      script.onerror = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        delete window[cb];
        list.innerHTML = '<p class="empty">Unable to load jobs. Make sure APPS_SCRIPT_URL is set and deployed.</p>';
      };
      script.src = APPS_SCRIPT_URL + '?action=getJobs&callback=' + cb;
      document.head.appendChild(script);
    }

    function renderJobList(jobs) {
      var list = document.getElementById('jobsList');
      if (!jobs.length) {
        list.innerHTML = '<p class="empty">No open jobs. Use the form above to post one.</p>';
        return;
      }
      list.innerHTML = jobs.map(function (job) {
        return '' +
          '<div class="job-item">' +
            '<div>' +
              '<p class="j-title">' + escapeHtml(job.title) + '</p>' +
              '<p class="j-meta">' + escapeHtml(job.department + ' • ' + job.location + ' • ' + job.type) + '</p>' +
            '</div>' +
            '<div class="actions">' +
              '<button class="btn btn-danger btn-sm job-del" data-id="' + escapeHtml(job.id) + '" data-title="' + escapeHtml(job.title) + '">Delete</button>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.job-del');
      if (!btn) return;
      deleteJob(btn.getAttribute('data-id'), btn.getAttribute('data-title'));
    });

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function submitPost(payload, done) {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function (res) { return res.json(); })
        .then(function (data) { done(data); })
        .catch(function () {
          try {
            fetch(APPS_SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });
          } catch (e) { /* ignore */ }
          done(null);
        });
    }
  </script>

</body>
</html>
