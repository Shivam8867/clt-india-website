name: Deploy to GoDaddy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ylr5llvbdv02
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "public_html"
          strip_components: 0
          overwrite: true


